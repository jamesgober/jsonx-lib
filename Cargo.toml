# =============================================================================
#  R E P S   ·   jsonx-lib
# =============================================================================
[package]
name    = "jsonx-lib"
version = "0.5.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Strict RFC 8259 JSON: a borrowing parser, a pull reader, and a deterministic writer, with budgets checked before allocation and no recursion. No dependencies, no_std."

# Keywords (5 max)
keywords = ["json", "parser", "serialization", "zero-copy", "no-std"]

# Categories
categories = ["encoding", "parser-implementations", "no-std"]

# Links
homepage      = "https://github.com/jamesgober/jsonx-lib"
repository    = "https://github.com/jamesgober/jsonx-lib"
documentation = "https://docs.rs/jsonx-lib"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

# Package contents: everything but the fuzz workspace, which is not part of
# the crate (its targets need nightly and libFuzzer).
exclude = ["fuzz/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "jsonx_lib"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
std = []


# DEPENDENCIES
# #################################
[dependencies]
# None. jsonx-lib is a leaf of the family: everything it needs is its own.


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"


# LINTS
# #################################
[lints.rust]
# `fuzzing` is set by cargo-fuzz, for the test files the fuzz targets share.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
# Used by this crate's own benchmarks only: a profile in a library's manifest
# has no effect on the crates that depend on it.
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
