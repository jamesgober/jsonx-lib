# Fuzz targets for every entry point that reads untrusted input (cargo-fuzz
# layout). libFuzzer does not build on Windows MSVC: run them on Linux (WSL
# works), on nightly, with the GNU target (the prebuilt cargo-fuzz defaults
# to musl, which AddressSanitizer cannot link):
#
#   cargo install cargo-fuzz
#   cargo +nightly fuzz run -O --target x86_64-unknown-linux-gnu parse -- -max_total_time=60
#
# Not published, and not part of the crate's package. The checks live in
# `../tests/harness/mod.rs`, shared with `../tests/fuzz_harness.rs`, which
# runs them on arbitrary bytes in plain `cargo test` on every platform.
[package]
name    = "jsonx-lib-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
jsonx-lib     = { path = ".." }
libfuzzer-sys = "0.4"

# The shared harness tests `cfg(feature = "std")` paths (`to_writer`); the
# feature is this package's own, on by default, so they are compiled in.
[features]
default = ["std"]
std     = ["jsonx-lib/std"]

# The harness files are shared with the crate's tests and test
# `cfg(fuzzing)`, which cargo-fuzz sets: declared here too, since the
# crate's own check-cfg does not reach this package (CI builds with
# `-D warnings`).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

# Its own workspace: kept out of the crate's builds.
[workspace]
members = ["."]

[[bin]]
name  = "parse"
path  = "fuzz_targets/parse.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "reader"
path  = "fuzz_targets/reader.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "stream"
path  = "fuzz_targets/stream.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "decode"
path  = "fuzz_targets/decode.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "write"
path  = "fuzz_targets/write.rs"
test  = false
doc   = false
bench = false
